name: Release - Android and iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove CocoaPods residuals
        run: |
          rm -f ios/Podfile ios/Podfile.lock
          rm -rf ios/Pods

      - name: Install dependencies
        run: flutter pub get

      - name: Patch camera_avfoundation for Xcode 16 / iOS 18
        run: |
          python3 -c "
          import glob, os
          patterns = [
              os.path.expanduser('~/.pub-cache/**/DefaultCamera.swift'),
              os.path.abspath('ios/**/DefaultCamera.swift'),
              os.path.abspath('build/**/DefaultCamera.swift')
          ]
          count = 0
          for p in patterns:
              for path in glob.glob(p, recursive=True):
                  with open(path) as f:
                      code = f.read()
                  code = code.replace('AVCaptureSession.wasInterruptedNotification', 'NSNotification.Name(\"AVCaptureSessionWasInterruptedNotification\")')
                  code = code.replace('AVCaptureSession.runtimeErrorNotification', 'NSNotification.Name(\"AVCaptureSessionRuntimeErrorNotification\")')
                  with open(path, 'w') as f:
                      f.write(code)
                  count += 1
          print(f'Patched {count} files.')
          "

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS release (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y project-zapp-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/project-zapp-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets/ios

      - name: Generate release tag
        id: tag
        run: echo "tag=release-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Project Zapp - ${{ steps.tag.outputs.tag }}"
          body: |
            ## Project Zapp Release

            Built automatically from `main` branch.
            Commit: `${{ github.sha }}`

            ### Downloads
            | Platform | File | Notes |
            |---|---|---|
            | Android arm64 | app-arm64-v8a-release.apk | Most modern phones |
            | Android arm32 | app-armeabi-v7a-release.apk | Older devices |
            | Android x86_64 | app-x86_64-release.apk | Emulators |
            | iOS | project-zapp-unsigned.ipa | Sideload via AltStore / Sideloadly |
          files: |
            release-assets/android/*.apk
            release-assets/ios/project-zapp-unsigned.ipa
          draft: false
          prerelease: false
