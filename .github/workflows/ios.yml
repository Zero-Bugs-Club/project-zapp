name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean CocoaPods residuals (use pure Swift Package Manager)
        run: |
          rm -f ios/Podfile ios/Podfile.lock
          rm -rf ios/Pods

      - name: Install dependencies
        run: flutter pub get

      - name: Patch camera_avfoundation for Xcode 16 / iOS 18
        run: |
          python3 -c "
          import glob, os
          patterns = [
              os.path.expanduser('~/.pub-cache/**/DefaultCamera.swift'),
              os.path.abspath('ios/**/DefaultCamera.swift'),
              os.path.abspath('build/**/DefaultCamera.swift')
          ]
          count = 0
          for p in patterns:
              for path in glob.glob(p, recursive=True):
                  print(f'Patching {path}')
                  with open(path, 'r') as f:
                      code = f.read()
                  code = code.replace('AVCaptureSession.wasInterruptedNotification', 'NSNotification.Name(\"AVCaptureSessionWasInterruptedNotification\")')
                  code = code.replace('AVCaptureSession.runtimeErrorNotification', 'NSNotification.Name(\"AVCaptureSessionRuntimeErrorNotification\")')
                  with open(path, 'w') as f:
                      f.write(code)
                  count += 1
          print(f'Successfully patched {count} files.')
          "

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS (Release Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y project-zapp-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-zapp-ios
          path: build/ios/iphoneos/project-zapp-unsigned.ipa
          if-no-files-found: error
